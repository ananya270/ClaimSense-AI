# ClaimSense AI Virtual Host Configuration
server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Enforce maximum client body size for multipart claim evidence uploads
    client_max_body_size 16M;

    # Defensive Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static UI assets routing
    location /css/ {
        alias /usr/share/nginx/html/css/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /js/ {
        alias /usr/share/nginx/html/js/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to backend WSGI application
    location /api/ {
        proxy_pass http://app:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Default fallback to Flask frontend handler
    location / {
        proxy_pass http://app:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
